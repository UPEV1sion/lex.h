name: "lex.h ci"
on:
  pull_request:
  push:
jobs:
  build-lex.h:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - run: nix build
    - run: nix develop -c make run_tests

